name: build

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      limit:
        description: "Datasets to cover (most downloaded first)"
        default: "50000"
      deadline_minutes:
        description: "Stop fetching from the Hub after this many minutes"
        default: "285"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'dataset-licence' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install package
        run: pip install -e ".[dev]"
      - name: Install Worker dependencies
        working-directory: mcp
        run: npm ci

      - name: Python tests
        run: python -m pytest -q
      - name: Worker tests
        working-directory: mcp
        run: npx vitest run

      # Facts from the previous build: datasets whose Hub revision is unchanged are not fetched
      # again. The Actions cache is the first choice (it survives a failed deploy); the live
      # site's shards are the fallback when the cache has expired.
      - name: Restore facts cache
        uses: actions/cache/restore@v4
        with:
          path: facts-cache
          key: facts-${{ github.run_id }}
          restore-keys: facts-
      - name: Fall back to the published facts
        run: |
          mkdir -p facts-cache
          if [ -z "$(ls -A facts-cache)" ] && [ -n "$BASE_URL" ]; then
            for i in $(seq 0 255); do
              n=$(printf '%02x' "$i")
              curl -sf -A "datalicense-build" "$BASE_URL/data/f/$n.json" -o "facts-cache/$n.json" || rm -f "facts-cache/$n.json"
            done
          fi
          echo "cache shards: $(ls facts-cache | wc -l)"

      - name: Build site
        env:
          LIMIT: ${{ inputs.limit || '50000' }}
          DEADLINE: ${{ inputs.deadline_minutes || '285' }}
        run: |
          if [ -z "$BASE_URL" ]; then echo "repository variable BASE_URL is not set" >&2; exit 1; fi
          args=(--limit "$LIMIT" --out site --base-url "$BASE_URL" --cache facts-cache --deadline-minutes "$DEADLINE")
          if [ -n "$CONTACT_EMAIL" ]; then args+=(--contact "$CONTACT_EMAIL"); fi
          python -m dlf build "${args[@]}"

      - name: Save facts cache
        if: always()
        run: |
          if [ -d site/data/f ] && [ -n "$(ls -A site/data/f)" ]; then
            rm -rf facts-cache && cp -r site/data/f facts-cache
          fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: facts-cache
          key: facts-${{ github.run_id }}

      - name: Deploy site to Cloudflare Pages
        working-directory: mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy ../site --project-name "$PAGES_PROJECT" --branch main

      - name: Check Worker config is real
        working-directory: mcp
        run: |
          if grep -q 'example.invalid' wrangler.toml; then
            echo "mcp/wrangler.toml still contains example.invalid (set SITE_URL)" >&2; exit 1
          fi
          if grep -Eq 'id *= *"0{32}"' wrangler.toml; then
            echo "mcp/wrangler.toml still has the all-zero KV namespace id" >&2; exit 1
          fi

      - name: Deploy MCP Worker
        working-directory: mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Alert on failure
        if: failure() || cancelled()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_TOKEN" ]; then
            echo "alert not sent: TG_TOKEN empty" >&2
            exit 1
          fi
          curl -sS --fail-with-body --max-time 20 -o /dev/null \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=dataset-licence build failed: ${RUN_URL}"
