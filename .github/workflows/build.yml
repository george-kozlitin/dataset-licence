name: build

on:
  # Daily sync: new datasets are added, changed ones re-fetched, removed ones dropped. While the
  # catalogue is still being filled, each run that leaves datasets deferred starts the next one.
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Datasets to cover (most downloaded first); 0 = every dataset on the Hub"
        default: "0"
      deadline_minutes:
        description: "Stop fetching from the Hub after this many minutes"
        default: "285"

permissions:
  contents: read
  actions: write  # the self-chain step dispatches the next run

# One build at a time: a chained or scheduled run queues behind the running one.
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'dataset-licence' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install package
        run: pip install -e ".[dev]"
      - name: Install Worker dependencies
        working-directory: mcp
        run: npm ci

      - name: Python tests
        run: python -m pytest -q
      - name: Worker tests
        working-directory: mcp
        run: npx vitest run

      # Facts from the previous build: datasets whose Hub revision is unchanged are not fetched
      # again. The Actions cache is the first choice (it survives a failed deploy); the live
      # site's shards are the fallback when the cache has expired.
      - name: Restore facts cache
        uses: actions/cache/restore@v4
        with:
          path: facts-cache
          key: facts-${{ github.run_id }}
          restore-keys: facts-
      - name: Fall back to the published facts
        run: |
          mkdir -p facts-cache
          fetch() {  # fetch <ext> <count> <hex digits>: 16 parallel requests; missing shards are skipped
            for i in $(seq 0 $(($2 - 1))); do printf "%0${3}x\n" "$i"; done | EXT=$1 xargs -P 16 -I{} sh -c \
              'curl -sf -A datalicense-build "$BASE_URL/data/f/$1.$EXT" -o "facts-cache/$1.$EXT" || rm -f "facts-cache/$1.$EXT"' _ {}
          }
          if [ -z "$(ls -A facts-cache)" ] && [ -n "$BASE_URL" ]; then
            fetch txt 1024 3
            if [ -z "$(ls -A facts-cache)" ]; then fetch json 256 2; fi
          fi
          echo "cache shards: $(ls facts-cache | wc -l)"

      - name: Build site
        id: build
        env:
          LIMIT: ${{ inputs.limit || '0' }}
          DEADLINE: ${{ inputs.deadline_minutes || '285' }}
        run: |
          if [ -z "$BASE_URL" ]; then echo "repository variable BASE_URL is not set" >&2; exit 1; fi
          args=(--limit "$LIMIT" --out site --base-url "$BASE_URL" --cache facts-cache --cache-out facts-cache --deadline-minutes "$DEADLINE")
          if [ -n "$CONTACT_EMAIL" ]; then args+=(--contact "$CONTACT_EMAIL"); fi
          python -m dlf build "${args[@]}"

      # The build writes every dataset's facts to facts-cache right after fetching, before
      # rendering, so a render or budget failure does not lose the run's fetching. When the build
      # failed before that point, the restored cache is saved again unchanged.
      - name: Save facts cache
        uses: actions/cache/save@v4
        if: always() && hashFiles('facts-cache/*') != ''
        with:
          path: facts-cache
          key: facts-${{ github.run_id }}

      - name: Deploy site to Cloudflare Pages
        working-directory: mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy ../site --project-name "$PAGES_PROJECT" --branch main

      - name: Check Worker config is real
        working-directory: mcp
        run: |
          if grep -q 'example.invalid' wrangler.toml; then
            echo "mcp/wrangler.toml still contains example.invalid (set SITE_URL)" >&2; exit 1
          fi
          if grep -Eq 'id *= *"0{32}"' wrangler.toml; then
            echo "mcp/wrangler.toml still has the all-zero KV namespace id" >&2; exit 1
          fi

      - name: Deploy MCP Worker
        working-directory: mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # Chain the next run while the catalogue is not fully fetched. fetched > 0 stops the chain
      # when a run makes no progress (it would otherwise loop on the same deferred datasets).
      - name: Start the next run
        if: fromJSON(steps.build.outputs.deferred || '0') > 0 && fromJSON(steps.build.outputs.fetched || '0') > 0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run build.yml --ref "$GITHUB_REF_NAME"

      - name: Alert on failure
        if: failure() || cancelled()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_TOKEN" ]; then
            echo "alert not sent: TG_TOKEN empty" >&2
            exit 1
          fi
          curl -sS --fail-with-body --max-time 20 -o /dev/null \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=dataset-licence build failed: ${RUN_URL}"
