[project]
name = "dlf"
version = "0.1.0"
description = "Dataset licence facts: static licence-fact pages for Hugging Face datasets"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "jinja2>=3.1,<4", "pyyaml>=6,<7"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dlf"]
include-package-data = true

[tool.setuptools.package-data]
dlf = ["templates/*.j2", "static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
